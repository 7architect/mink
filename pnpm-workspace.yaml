packages:
  - packages/*
  - apps/*
allowBuilds:
  esbuild: true
  sharp: true
# Nextra 4.6.1 validates React nodes with the Zod 4.1 semantics it targets.
# Newer Zod rejects its Layout's intentionally removed children property.
overrides:
  nextra@4.6.1>zod: 4.1.12
  nextra-theme-docs@4.6.1>zod: 4.1.12

catalog:
  react: 19.3.0
  ink: 8.0.0
